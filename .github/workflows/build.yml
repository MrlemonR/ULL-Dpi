name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Tek sır yeterli: anahtar dosyasının kendisi (base64). Şifresi sabit,
      # dosya olmadan işe yaramıyor.
      KEYSTORE_B64: ${{ secrets.ULL_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarı (varsa)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ull.jks"
          echo "ULL_KEYSTORE=$RUNNER_TEMP/ull.jks" >> "$GITHUB_ENV"

      - name: Hangi imza?
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "::notice::İmza: sabit anahtar (ULL_KEYSTORE_B64) — güncellemeler eskinin üstüne kurulur"
          else
            echo "::warning::İmza: geçici debug anahtarı — ULL_KEYSTORE_B64 sırrı bulunamadı"
          fi

      - name: Testler
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Dosya adları
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ULL-DPI-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/ULL-DPI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ULL-DPI-apk
          path: out/*.apk

      - name: Sürüm notu
        run: |
          {
            echo '**İndir:** aşağıdaki `ULL-DPI.apk`'
            echo
            git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' | sed 's/</\&lt;/g'
          } > notes.md

      # Ana dala her push yeni bir sürüm: Releases'ta "Latest" hep son APK.
      - name: Sürüm yayınla
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: ULL-DPI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: notes.md
          files: out/ULL-DPI.apk
